<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="map"><div class="map-road-h" style="top: 18%;"></div><div class="map-road-h" style="top: 72%;"></div><div class="map-road-v" style="left: 28%;"></div><div class="map-road-v" style="left: 70%;"></div><div class="map-river"></div></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <!-- pickup pin pulsing -->
  <div class="pin pin-pickup" style="top: 40%; left: 45%;"></div>
  <div class="pin pin-dropoff" style="top: 68%; left: 60%;"></div>

  <!-- route polyline drawn with SVG -->
  <svg style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;" viewBox="0 0 393 852" xmlns="http://www.w3.org/2000/svg">
    <path d="M 177 341  C 220 380, 200 480, 235 580" stroke="#1F8F60" stroke-width="5" stroke-linecap="round" fill="none" stroke-dasharray="2 8" />
  </svg>

  <!-- searching sheet -->
  <div class="sheet">
    <div style="display: flex; align-items: center; gap: var(--m);">
      <div class="spinner"></div>
      <div class="h-m">Looking for a driver…</div>
    </div>
    <div class="gap-s"></div>
    <div class="body">We are checking nearby scooters.</div>
    <div class="gap-l"></div>
    <div style="display: flex; justify-content: flex-start;">
      <button class="btn-text" style="color: var(--danger);">Cancel request</button>
    </div>
  </div>
</div>
</body></html>

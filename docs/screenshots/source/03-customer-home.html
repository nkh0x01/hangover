<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="map"><div class="map-road-h" style="top: 18%;"></div><div class="map-road-h" style="top: 72%;"></div><div class="map-road-v" style="left: 28%;"></div><div class="map-road-v" style="left: 70%;"></div><div class="map-river"></div></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <!-- nearby drivers (positions roughly clustered around the pickup) -->
  <div class="pin pin-driver" style="top: 22%; left: 30%;">🛵</div>
  <div class="pin pin-driver" style="top: 32%; left: 65%;">🛵</div>
  <div class="pin pin-driver" style="top: 44%; left: 22%;">🛵</div>
  <div class="pin pin-driver" style="top: 38%; left: 78%;">🛵</div>
  <div class="pin pin-driver" style="top: 60%; left: 48%;">🛵</div>

  <!-- pickup (center, blue user dot would be on top in real device) -->
  <div class="pin pin-pickup" style="top: 50%; left: 50%; width: 18px; height: 18px;"></div>

  <!-- "Where to?" card -->
  <div style="position: absolute; left: var(--l); right: var(--l); bottom: var(--l);
              background: #FFF; border-radius: var(--r-l);
              box-shadow: 0 4px 24px rgba(0,0,0,0.16);
              padding: var(--l); display: flex; align-items: center; gap: var(--m);">
    <span style="font-size: 18px;">🔍</span>
    <div style="flex: 1;">
      <div class="body-strong">Where to?</div>
      <div class="caption">Tap a destination on the map</div>
    </div>
    <span style="color: var(--on-surface-variant);">›</span>
  </div>

  <!-- top-left "menu" button -->
  <div style="position: absolute; top: 56px; left: var(--l);
              width: 44px; height: 44px;
              background: #FFF; border-radius: 50%;
              box-shadow: 0 2px 6px rgba(0,0,0,0.18);
              display: flex; align-items: center; justify-content: center;
              font-size: 18px;">☰</div>

  <!-- top-right "locate me" -->
  <div style="position: absolute; top: 56px; right: var(--l);
              width: 44px; height: 44px;
              background: #FFF; border-radius: 50%;
              box-shadow: 0 2px 6px rgba(0,0,0,0.18);
              display: flex; align-items: center; justify-content: center;
              font-size: 18px;">⊙</div>
</div>
</body></html>

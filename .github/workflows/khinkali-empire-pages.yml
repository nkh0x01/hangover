# Build the Khinkali Empire game and deploy it to GitHub Pages so it can be
# opened on any phone via a public URL.
name: Deploy Khinkali Empire to Pages

on:
  push:
    branches:
      - claude/khinkali-empire-game-aRzLY
    paths:
      - 'khinkali-empire/**'
      - '.github/workflows/khinkali-empire-pages.yml'
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only the latest deploy runs at a time; in-progress ones are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: khinkali-empire
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: khinkali-empire/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: khinkali-empire/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

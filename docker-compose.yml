name: hangover

# Local development stack for the Hangover Mobility Platform.
# Production runs on ECS — see docs/architecture/09-deployment-architecture.md.

services:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    image: hangover/backend:dev
    container_name: hangover-api
    env_file: ./backend/.env
    environment:
      APP_ROLE: api
      CONTAINER_ROLE: api
    volumes:
      - ./backend:/var/www/html:cached
      - backend_storage:/var/www/html/storage
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  horizon:
    image: hangover/backend:dev
    container_name: hangover-horizon
    env_file: ./backend/.env
    environment:
      APP_ROLE: horizon
      CONTAINER_ROLE: horizon
    volumes:
      - ./backend:/var/www/html:cached
      - backend_storage:/var/www/html/storage
    depends_on:
      api:
        condition: service_healthy
    command: ["/usr/local/bin/entrypoint-horizon.sh"]

  reverb:
    image: hangover/backend:dev
    container_name: hangover-reverb
    env_file: ./backend/.env
    environment:
      APP_ROLE: reverb
      CONTAINER_ROLE: reverb
    volumes:
      - ./backend:/var/www/html:cached
      - backend_storage:/var/www/html/storage
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: ["/usr/local/bin/entrypoint-reverb.sh"]

  scheduler:
    image: hangover/backend:dev
    container_name: hangover-scheduler
    env_file: ./backend/.env
    environment:
      APP_ROLE: scheduler
      CONTAINER_ROLE: scheduler
    volumes:
      - ./backend:/var/www/html:cached
      - backend_storage:/var/www/html/storage
    depends_on:
      api:
        condition: service_healthy
    command: ["/usr/local/bin/entrypoint-scheduler.sh"]

  mysql:
    image: mysql:8.0
    container_name: hangover-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hangover
      MYSQL_USER: hangover
      MYSQL_PASSWORD: hangover
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_allowed_packet=64M
      - --innodb_buffer_pool_size=512M
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uhangover", "-phangover"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: hangover-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: hangover-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: hangover-minio
    environment:
      MINIO_ROOT_USER: hangover
      MINIO_ROOT_PASSWORD: hangover-secret
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-bootstrap:
    image: minio/mc:latest
    container_name: hangover-minio-bootstrap
    depends_on:
      - minio
    entrypoint: >
      sh -c "
        sleep 2 &&
        mc alias set local http://minio:9000 hangover hangover-secret &&
        mc mb -p local/driver-docs   || true &&
        mc mb -p local/avatars       || true &&
        mc mb -p local/exports       || true &&
        echo 'MinIO buckets ready'
      "
    restart: "no"

volumes:
  mysql_data:
  redis_data:
  minio_data:
  backend_storage:

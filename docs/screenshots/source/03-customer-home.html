<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="map">
    <div class="map-road-h" style="top: 18%;"></div>
    <div class="map-road-h" style="top: 72%;"></div>
    <div class="map-road-v" style="left: 28%;"></div>
    <div class="map-road-v" style="left: 70%;"></div>
    <div class="map-river"></div>
  </div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <!-- nearby drivers -->
  <div class="pin pin-driver live" style="top: 22%; left: 30%;">🛵</div>
  <div class="pin pin-driver" style="top: 32%; left: 65%;">🛵</div>
  <div class="pin pin-driver" style="top: 44%; left: 22%;">🛵</div>
  <div class="pin pin-driver" style="top: 38%; left: 78%;">🛵</div>
  <div class="pin pin-driver" style="top: 60%; left: 48%;">🛵</div>

  <div class="pin pin-pickup pulsing" style="top: 50%; left: 50%;"></div>

  <!-- Top floating chrome -->
  <div style="position: absolute; top: 56px; left: var(--l); right: var(--l); z-index: 3;
              display: flex; align-items: center; justify-content: space-between;">
    <div class="circle-ctrl">☰</div>
    <div class="live-pill">5 online nearby</div>
    <div class="circle-ctrl">🔔</div>
  </div>

  <!-- Locate FAB -->
  <div style="position: absolute; right: var(--l); bottom: 240px; z-index: 3;">
    <div class="fab">⊙</div>
  </div>

  <!-- Where-to card -->
  <div style="position: absolute; left: var(--l); right: var(--l); bottom: var(--l); z-index: 3;">
    <div class="card" style="padding: var(--l);">
      <div style="display: flex; align-items: center; gap: var(--m);">
        <div style="width: 44px; height: 44px; border-radius: 50%;
                    background: var(--surface-2);
                    display: flex; align-items: center; justify-content: center;
                    font-size: 18px; color: var(--ink);">🔍</div>
        <div style="flex: 1;">
          <div class="t-title-l">სად მიდიხართ?</div>
          <div class="t-caption">Where to?</div>
        </div>
        <span style="color: var(--ink-soft); font-size: 22px;">›</span>
      </div>

      <div style="border-top: 1px solid var(--outline-subtle); margin: var(--m) 0;"></div>

      <div style="display: flex; gap: var(--s);">
        <div class="chip">🏠 Home</div>
        <div class="chip">💼 Work</div>
        <div class="chip">🕘 Recent</div>
      </div>
    </div>
  </div>
</div>
</body></html>

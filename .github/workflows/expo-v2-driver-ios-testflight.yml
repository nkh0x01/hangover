name: Expo V2 Driver iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional CFBundleShortVersionString override. Defaults to 2.0.0 for V2."
        required: false
        type: string
      build_number:
        description: "Optional CFBundleVersion override. Defaults to 200000 + GitHub run number."
        required: false
        type: string
      submit_to_testflight:
        description: "Upload the generated IPA to App Store Connect/TestFlight."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: expo-v2-driver-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Driver iOS EAS build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: mobile-v2

    env:
      APP_TARGET: driver
      APP_LABEL: Driver
      APP_BUNDLE_ID: app.ride360.driver
      APP_NAME: Ride 360 Driver V2
      APP_ROLE: driver
      EAS_BUILD_PROFILE: driver-ios-testflight
      EXPO_APP_TARGET: driver
      EXPO_PUBLIC_APP_NAME: Ride 360 Driver V2
      EXPO_PUBLIC_APP_ROLE: driver
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_API_BASE_URL: https://ride.365sakartvelo.com
      EXPO_EAS_PROJECT_ID: ${{ secrets.EXPO_DRIVER_EAS_PROJECT_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_DRIVER_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_DRIVER_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-v2/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve V2 version and build number
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION_NAME:-}"
          build_number="${INPUT_BUILD_NUMBER:-}"

          if [ -z "$version" ]; then
            version="2.0.0"
          fi

          if [ -z "$build_number" ]; then
            build_number="$((200000 + GITHUB_RUN_NUMBER))"
          fi

          if ! [[ "$build_number" =~ ^[0-9]+$ ]]; then
            echo "build_number must be an integer."
            exit 1
          fi

          echo "EXPO_PUBLIC_APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Inject version into EAS build profile
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");

          const profile = process.env.EAS_BUILD_PROFILE;
          const version = process.env.EXPO_PUBLIC_APP_VERSION;
          const buildNumber = process.env.IOS_BUILD_NUMBER;

          if (!profile || !version || !buildNumber) {
            throw new Error("Missing EAS build profile, app version, or iOS build number.");
          }

          const path = "eas.json";
          const eas = JSON.parse(fs.readFileSync(path, "utf8"));
          const buildProfile = eas.build?.[profile];

          if (!buildProfile) {
            throw new Error(`Missing EAS build profile "${profile}".`);
          }

          buildProfile.env = {
            ...(buildProfile.env ?? {}),
            EXPO_PUBLIC_APP_VERSION: version,
            IOS_BUILD_NUMBER: buildNumber,
          };

          fs.writeFileSync(path, `${JSON.stringify(eas, null, 2)}\n`);
          console.log(`Prepared ${profile} for ${version} (${buildNumber}).`);
          NODE

      - name: Verify required CI configuration
        run: |
          set -euo pipefail

          if [ -z "${EXPO_EAS_PROJECT_ID:-}" ]; then
            echo "Missing EXPO_DRIVER_EAS_PROJECT_ID secret."
            exit 1
          fi

          if [ -z "${IOS_DISTRIBUTION_CERTIFICATE_BASE64:-}" ]; then
            echo "Missing IOS_DISTRIBUTION_CERTIFICATE_BASE64 secret."
            exit 1
          fi

          if [ -z "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ]; then
            echo "Missing IOS_DISTRIBUTION_CERTIFICATE_PASSWORD secret."
            exit 1
          fi

          if [ -z "${IOS_DRIVER_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "Missing IOS_DRIVER_PROVISIONING_PROFILE_BASE64 secret."
            exit 1
          fi

          if [ "${{ inputs.submit_to_testflight }}" = "true" ] && [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            echo "Missing APP_STORE_CONNECT_ISSUER_ID secret required for TestFlight upload."
            exit 1
          fi

          if [ "${{ inputs.submit_to_testflight }}" = "true" ] && [ -z "${APP_STORE_CONNECT_KEY_ID:-}" ]; then
            echo "Missing APP_STORE_CONNECT_KEY_ID secret required for TestFlight upload."
            exit 1
          fi

          if [ "${{ inputs.submit_to_testflight }}" = "true" ] && [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]; then
            echo "Missing APP_STORE_CONNECT_PRIVATE_KEY secret required for TestFlight upload."
            exit 1
          fi

      - name: Prepare EAS local iOS credentials
        run: |
          set -euo pipefail
          mkdir -p .ci/driver

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          cert_path = root / ".ci" / "driver" / "distribution.p12"
          profile_path = root / ".ci" / "driver" / "profile.mobileprovision"

          cert_path.write_bytes(base64.b64decode("".join(os.environ["IOS_DISTRIBUTION_CERTIFICATE_BASE64"].split())))
          profile_path.write_bytes(base64.b64decode("".join(os.environ["IOS_DRIVER_PROVISIONING_PROFILE_BASE64"].split())))

          credentials = {
              "ios": {
                  "provisioningProfilePath": str(profile_path.relative_to(root)),
                  "distributionCertificate": {
                      "path": str(cert_path.relative_to(root)),
                      "password": os.environ["IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"],
                  },
              },
          }
          (root / "credentials.json").write_text(json.dumps(credentials, indent=2) + "\n")
          PY

      - name: Lint/analyze
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production config and string scan
        run: npm run check:production

      - name: Build iOS on EAS
        run: |
          set -euo pipefail
          eas build \
            --platform ios \
            --profile "$EAS_BUILD_PROFILE" \
            --non-interactive \
            --wait \
            --json > eas-build.json

      - name: Download IPA artifact from EAS
        run: |
          set -euo pipefail
          build_id="$(node scripts/eas-build-id.mjs eas-build.json)"
          echo "EAS_BUILD_ID=$build_id" >> "$GITHUB_ENV"

          mkdir -p "artifacts/$APP_TARGET"
          artifact_url="$(node - <<'NODE'
          const fs = require("node:fs");
          const parsed = JSON.parse(fs.readFileSync("eas-build.json", "utf8"));
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const url = build?.artifacts?.applicationArchiveUrl ?? build?.artifacts?.buildUrl;
          if (!url) {
            console.error("Could not read EAS build artifact URL from eas-build.json.");
            process.exit(1);
          }
          console.log(url);
          NODE
          )"
          ipa_path="artifacts/$APP_TARGET/Ride360-${APP_LABEL}-V2-${IOS_BUILD_NUMBER}.ipa"
          curl --fail --location --retry 3 --output "$ipa_path" "$artifact_url"
          node -e 'const fs = require("node:fs"); const path = process.argv[1]; const bytes = fs.statSync(path).size; if (bytes < 1000000) { console.error(`Downloaded IPA is unexpectedly small: ${bytes} bytes`); process.exit(1); }' "$ipa_path"
          printf '{"buildId":"%s","artifactPath":"%s"}\n' "$build_id" "$ipa_path" > eas-download.json

          if [ -z "$ipa_path" ]; then
            echo "No IPA artifact was downloaded."
            exit 1
          fi

          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Submit IPA to TestFlight
        if: ${{ inputs.submit_to_testflight }}
        run: |
          set -euo pipefail
          mkdir -p .ci/asc
          asc_key_path=".ci/asc/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].strip().replace("\\n", "\n")
          if not key.endswith("\n"):
              key += "\n"
          path = Path(".ci/asc") / f"AuthKey_{os.environ['APP_STORE_CONNECT_KEY_ID']}.p8"
          path.write_text(key)
          path.chmod(0o600)
          PY
          asc_app_id="$(node scripts/resolve-asc-app-id.mjs \
            "$APP_BUNDLE_ID" \
            "$asc_key_path" \
            "$APP_STORE_CONNECT_KEY_ID" \
            "$APP_STORE_CONNECT_ISSUER_ID")"
          echo "Resolved App Store Connect app id for $APP_BUNDLE_ID."
          node scripts/configure-eas-submit.mjs \
            "$EAS_BUILD_PROFILE" \
            "$asc_app_id" \
            "${APPLE_TEAM_ID:-}" \
            "$asc_key_path" \
            "$APP_STORE_CONNECT_KEY_ID" \
            "$APP_STORE_CONNECT_ISSUER_ID"
          eas submit \
            --platform ios \
            --profile "$EAS_BUILD_PROFILE" \
            --path "$IPA_PATH" \
            --non-interactive \
            --wait | tee eas-submit.log
          printf '{"status":"submitted","ipaPath":"%s"}\n' "$IPA_PATH" > eas-submit.json

      - name: Write build report
        if: always()
        run: |
          node scripts/write-ios-build-report.mjs \
            --app "$APP_TARGET" \
            --bundle-id "$APP_BUNDLE_ID" \
            --version "${EXPO_PUBLIC_APP_VERSION:-unknown}" \
            --build-number "${IOS_BUILD_NUMBER:-unknown}" \
            --ipa-path "${IPA_PATH:-not downloaded}" \
            --submit-enabled "${{ inputs.submit_to_testflight }}" \
            --build-json eas-build.json \
            --submit-json eas-submit.json

      - name: Upload Driver IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ride360-Driver-Expo-V2-iOS
          if-no-files-found: ignore
          path: |
            mobile-v2/artifacts/driver/*.ipa
            mobile-v2/eas-build.json
            mobile-v2/eas-submit.log
            mobile-v2/eas-submit.json

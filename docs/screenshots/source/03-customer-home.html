<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="map">
    <div class="map-road-h" style="top: 18%;"></div>
    <div class="map-road-h" style="top: 72%;"></div>
    <div class="map-road-v" style="left: 28%;"></div>
    <div class="map-road-v" style="left: 70%;"></div>
    <div class="map-river"></div>
  </div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <!-- nearby drivers -->
  <div class="pin pin-driver" style="top: 22%; left: 30%;">🛵</div>
  <div class="pin pin-driver" style="top: 32%; left: 65%;">🛵</div>
  <div class="pin pin-driver" style="top: 44%; left: 22%;">🛵</div>
  <div class="pin pin-driver" style="top: 38%; left: 78%;">🛵</div>
  <div class="pin pin-driver" style="top: 60%; left: 48%;">🛵</div>

  <!-- pickup -->
  <div class="pin pin-pickup" style="top: 50%; left: 50%;"></div>

  <!-- top control row -->
  <div style="position: absolute; top: 56px; left: var(--l); right: var(--l);
              display: flex; align-items: center; justify-content: space-between;
              z-index: 3;">
    <div class="circle-ctrl">☰</div>
    <div class="live-pill">5 online nearby</div>
    <div class="circle-ctrl">🔔</div>
  </div>

  <!-- locate FAB -->
  <div style="position: absolute; bottom: 230px; right: var(--l); z-index: 3;">
    <div class="fab">⊙</div>
  </div>

  <!-- "Where to?" card with quick chips -->
  <div style="position: absolute; left: var(--l); right: var(--l); bottom: var(--l); z-index: 3;">
    <div style="background: #FFF; border-radius: var(--r-xl);
                box-shadow: 0 8px 24px rgba(0,0,0,0.12);
                padding: var(--l);">
      <div style="display: flex; align-items: center; gap: var(--m);">
        <span style="font-size: 18px; color: var(--ink-soft);">🔍</span>
        <div style="flex: 1;">
          <div class="t-title-l">სად მიდიხართ? · Where to?</div>
        </div>
        <span style="color: var(--ink-soft); font-size: 20px;">›</span>
      </div>

      <div style="border-top: 1px solid var(--outline-subtle); margin: var(--m) 0;"></div>

      <div style="display: flex; gap: var(--s); flex-wrap: wrap;">
        <div style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
                    background: var(--surface-2); border-radius: var(--r-pill);
                    font-size: 12px; font-weight: 600; color: var(--ink);">
          🏠 Home
        </div>
        <div style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
                    background: var(--surface-2); border-radius: var(--r-pill);
                    font-size: 12px; font-weight: 600; color: var(--ink);">
          💼 Work
        </div>
        <div style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
                    background: var(--surface-2); border-radius: var(--r-pill);
                    font-size: 12px; font-weight: 600; color: var(--ink);">
          🕘 Recent
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>

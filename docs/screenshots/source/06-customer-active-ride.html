<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="map">
    <div class="map-road-h" style="top: 18%;"></div>
    <div class="map-road-h" style="top: 72%;"></div>
    <div class="map-road-v" style="left: 28%;"></div>
    <div class="map-road-v" style="left: 70%;"></div>
    <div class="map-river"></div>
  </div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <!-- Gradient ETA banner at top -->
  <div style="position: absolute; top: 56px; left: var(--l); right: var(--l); z-index: 3;
              background: var(--grad-ink); color: #FFF;
              border-radius: var(--r-l);
              padding: 14px var(--l);
              display: flex; align-items: center; gap: 12px;
              box-shadow: 0 12px 30px rgba(0,0,0,0.32);">
    <div style="width: 10px; height: 10px; background: var(--success); border-radius: 50%;
                box-shadow: 0 0 0 4px rgba(46,162,101,0.35);"></div>
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
                  text-transform: uppercase; color: rgba(255,255,255,0.7);">Driver arrives in</div>
      <div style="font-size: 18px; font-weight: 800; letter-spacing: -0.3px;">2 min · 320 m</div>
    </div>
    <div style="margin-left: auto;">
      <div style="width: 40px; height: 40px; border-radius: 50%;
                  background: rgba(255,255,255,0.12);
                  display: flex; align-items: center; justify-content: center;
                  font-size: 16px;">📤</div>
    </div>
  </div>

  <!-- Animated route -->
  <div class="pin pin-driver live" style="top: 30%; left: 35%; width: 40px; height: 40px; font-size: 18px;">🛵</div>
  <div class="pin pin-pickup" style="top: 48%; left: 50%;"></div>
  <div class="pin pin-dropoff" style="top: 64%; left: 56%;"></div>

  <svg style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;" viewBox="0 0 393 852" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2EC07F"/>
        <stop offset="100%" stop-color="#1F8F60"/>
      </linearGradient>
    </defs>
    <path d="M 137 256  C 175 290, 185 360, 196 408" stroke="url(#rg)" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 196 408  L 220 545" stroke="#1F8F60" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.32" stroke-dasharray="2 9" />
  </svg>

  <!-- Driver info sheet -->
  <div class="sheet">
    <div class="handle"></div>

    <div class="phase-progress">
      <div class="seg on"></div>
      <div class="seg on"></div>
      <div class="seg"></div>
      <div class="seg"></div>
    </div>

    <div class="gap-l"></div>

    <div style="display: flex; align-items: center; gap: var(--m);">
      <div class="phase-label">Driver on the way</div>
      <div style="margin-left: auto;" class="t-title-l">4 min</div>
    </div>

    <div class="gap-m"></div>

    <div style="display: flex; align-items: center; gap: var(--m);">
      <div style="width: 56px; height: 56px; border-radius: 50%;
                  background: var(--grad-ink);
                  display: flex; align-items: center; justify-content: center;
                  font-size: 22px; color: var(--accent);
                  box-shadow: var(--sh-card);">👤</div>
      <div style="flex: 1;">
        <div class="t-title-l">Giorgi Maisuradze</div>
        <div class="t-body" style="margin-top: 2px;">
          <span style="color: var(--warning);">★</span> 4.92 · 230 trips
        </div>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2);
                  display: flex; align-items: center; justify-content: center;
                  box-shadow: var(--sh-card);">💬</div>
      <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--grad-primary);
                  display: flex; align-items: center; justify-content: center;
                  color: #FFF; font-size: 18px;
                  box-shadow: var(--sh-hero-green);">📞</div>
    </div>

    <div class="gap-m"></div>

    <div class="card-soft" style="display: flex; align-items: center; gap: var(--m);">
      <div style="width: 36px; height: 36px; border-radius: 8px;
                  background: var(--ink); color: var(--accent);
                  display: flex; align-items: center; justify-content: center; font-size: 16px;">🛵</div>
      <div style="flex: 1;">
        <div class="t-label">Vehicle</div>
        <div class="t-title-m" style="margin-top: 2px;">Xiaomi Mi Pro 2 · Black</div>
      </div>
      <div style="background: #FFF; padding: 6px 10px; border-radius: 6px;
                  font-family: monospace; font-weight: 800; font-size: 14px;
                  border: 1px solid var(--outline-subtle);
                  letter-spacing: 1px;">
        TB-4291
      </div>
    </div>

    <div class="gap-m"></div>

    <div style="display: flex; align-items: center;">
      <span class="t-body-strong">7.50 GEL · Cash</span>
      <span style="margin-left: auto;" class="btn-text">Cancel ride</span>
    </div>
  </div>
</div>
</body></html>

; Hangover backend — PHP runtime tuning
date.timezone = UTC

memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 60
max_input_vars = 5000

expose_php = Off

; Errors: app emits structured JSON via Laravel's handler.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Sessions are not used for API — only the Filament admin panel uses them.
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600

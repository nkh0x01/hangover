<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="map" style="filter: brightness(0.7);">
    <div class="map-road-h" style="top: 18%;"></div>
    <div class="map-road-h" style="top: 72%;"></div>
    <div class="map-road-v" style="left: 28%;"></div>
    <div class="map-road-v" style="left: 70%;"></div>
    <div class="map-river"></div>
  </div>

  <div class="status-bar" style="color: #FFF;">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <div class="modal-scrim">
    <div class="sheet">
      <div class="handle"></div>

      <div style="display: flex; align-items: center; gap: var(--m);">
        <div class="t-h-m" style="flex: 1;">New ride</div>
        <div class="ring">
          <svg width="56" height="56" viewBox="0 0 56 56">
            <circle cx="28" cy="28" r="24" stroke="#E9E4D6" stroke-width="5" fill="none"></circle>
            <circle cx="28" cy="28" r="24" stroke="#1F8F60" stroke-width="5" fill="none"
                    stroke-dasharray="150 200" stroke-linecap="round"></circle>
          </svg>
          <div class="label">9s</div>
        </div>
      </div>

      <div class="gap-l"></div>

      <!-- pickup row -->
      <div style="display: flex; align-items: flex-start; gap: var(--m);">
        <div style="width: 32px; height: 32px; border-radius: 50%;
                    background: rgba(31,143,96,0.12);
                    display: flex; align-items: center; justify-content: center;
                    color: var(--seed); font-size: 16px;">●</div>
        <div>
          <div class="t-title-m">Marjanishvili 4</div>
          <div class="t-body" style="margin-top: 2px;">~320 m to pickup · 2 min</div>
        </div>
      </div>
      <div class="gap-s"></div>
      <!-- dropoff row -->
      <div style="display: flex; align-items: flex-start; gap: var(--m);">
        <div style="width: 32px; height: 32px; border-radius: 50%;
                    background: rgba(215,38,61,0.12);
                    display: flex; align-items: center; justify-content: center;
                    color: var(--danger); font-size: 16px;">📍</div>
        <div>
          <div class="t-title-m">Vake Park</div>
          <div class="t-body" style="margin-top: 2px;">2.7 km trip · ~7 min</div>
        </div>
      </div>

      <div class="gap-l"></div>

      <!-- Fare hero -->
      <div class="card-soft" style="display: flex; align-items: center; padding: var(--l);">
        <div>
          <div class="t-label">Fare</div>
          <div class="t-h-m" style="margin-top: 4px;">7.50 GEL</div>
        </div>
        <div style="margin-left: auto; text-align: right;">
          <div class="t-label">Customer</div>
          <div style="display: flex; align-items: center; gap: 4px; margin-top: 4px;">
            <span style="color: var(--warning); font-size: 16px;">★</span>
            <span style="font-weight: 700; font-size: 16px;">4.92</span>
          </div>
        </div>
      </div>

      <div class="gap-l"></div>

      <!-- Actions: Accept dominant, Reject secondary -->
      <button class="btn-primary accept">✓ Accept ride</button>
      <div class="gap-s"></div>
      <button class="btn-outline">Reject</button>
    </div>
  </div>
</div>
</body></html>

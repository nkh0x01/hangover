name: Build Driver iOS

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional CFBundleShortVersionString override, for example 1.0.0"
        required: false
        type: string
      build_number:
        description: "Optional CFBundleVersion override, must be an integer"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ride360-driver-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-testflight:
    name: Driver IPA to TestFlight
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify manual signing secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_DRIVER_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_DRIVER_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          missing=0

          if [ -n "${IOS_DISTRIBUTION_CERTIFICATE_BASE64:-}" ]; then
            echo "manual certificate secret present: yes"
          else
            echo "manual certificate secret present: no"
            missing=1
          fi

          if [ -n "${IOS_DRIVER_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "driver provisioning profile secret present: yes"
          else
            echo "driver provisioning profile secret present: no"
            missing=1
          fi

          if [ -n "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ]; then
            echo "certificate password secret present: yes"
          else
            echo "certificate password secret present: no"
            missing=1
          fi

          if [ -n "${IOS_KEYCHAIN_PASSWORD:-}" ]; then
            echo "keychain password secret present: yes"
          else
            echo "keychain password secret present: no"
            missing=1
          fi

          exit "$missing"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build, export, and upload Driver IPA
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_MAPS_API_KEY: ${{ secrets.IOS_MAPS_API_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_DRIVER_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_DRIVER_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          API_BASE_URL: https://ride.365sakartvelo.com
          RIDE360_RELEASE_BUILD: "true"
          DEV_BYPASS_ENABLED: "false"
          IOS_VERSION_NAME: ${{ inputs.version_name }}
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
        run: bash mobile/scripts/github_actions/build_ios_driver_testflight.sh

      - name: Upload Driver IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ride360-Driver-iOS
          if-no-files-found: ignore
          path: |
            build/github-actions-ios/driver/*.ipa
            build/github-actions-ios/driver/*.sha256

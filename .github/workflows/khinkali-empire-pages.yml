# Build the Khinkali Empire game and publish it to a `gh-pages` branch so it
# can be opened on any phone via a public URL. Pushing the built site to a
# branch (instead of the Pages "deployment" API) avoids the github-pages
# environment's branch-protection rules, so this works from a feature branch.
name: Deploy Khinkali Empire to Pages

on:
  push:
    branches:
      - claude/khinkali-empire-game-aRzLY
    paths:
      - 'khinkali-empire/**'
      - '.github/workflows/khinkali-empire-pages.yml'
  workflow_dispatch:

# Needs write access to push the generated site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: khinkali-empire/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: khinkali-empire

      - name: Build
        run: npm run build
        working-directory: khinkali-empire

      - name: Publish to gh-pages branch
        working-directory: khinkali-empire/dist
        run: |
          # .nojekyll stops GitHub Pages from running Jekyll over the Vite
          # output (which keeps the assets/ folder intact).
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy Khinkali Empire ($GITHUB_SHA)"
          git branch -M gh-pages
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

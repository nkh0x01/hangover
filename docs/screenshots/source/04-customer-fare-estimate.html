<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone gradient">
  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <div class="app-bar">
    <div class="back">←</div>
    <span>Confirm ride</span>
  </div>

  <div style="padding: 0 var(--xl);">

    <!-- Route card -->
    <div class="card">
      <div class="route-row">
        <div style="margin-top: 2px;">
          <div style="width: 14px; height: 14px; border-radius: 50%; background: var(--seed);
                      border: 2.5px solid #FFF;
                      box-shadow: 0 0 0 3px rgba(31,143,96,0.18);"></div>
        </div>
        <div>
          <div class="t-label">Pickup</div>
          <div class="t-title-m" style="margin-top: 2px;">Marjanishvili 4</div>
        </div>
      </div>
      <div class="dotty"></div>
      <div class="route-row">
        <div style="margin-top: 2px;">
          <div style="width: 14px; height: 14px; background: var(--danger);
                      border-radius: 3px 14px 14px 14px;
                      box-shadow: 0 0 0 3px rgba(215,38,61,0.18);
                      transform: rotate(-45deg);"></div>
        </div>
        <div>
          <div class="t-label">Dropoff</div>
          <div class="t-title-m" style="margin-top: 2px;">Vake Park</div>
        </div>
      </div>
    </div>

    <div class="gap-l"></div>

    <!-- HERO fare gradient card -->
    <div style="background: var(--grad-primary); border-radius: var(--r-l);
                padding: var(--l) var(--l) var(--l);
                color: #FFF; position: relative; overflow: hidden;
                box-shadow: var(--sh-hero-green);">
      <div style="position: absolute; right: -40px; top: -40px; width: 160px; height: 160px;
                  border: 6px solid rgba(255,255,255,0.10); border-radius: 50%;"></div>
      <div style="position: absolute; right: 40px; bottom: -60px; width: 100px; height: 100px;
                  border: 4px solid rgba(255,255,255,0.06); border-radius: 50%;"></div>

      <div style="display: flex; align-items: center; position: relative; z-index: 2;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.7px;
                    text-transform: uppercase; color: rgba(255,255,255,0.78);">Estimated fare</div>
        <div style="margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
                    padding: 4px 10px; border-radius: 999px;
                    background: rgba(255,255,255,0.16);
                    border: 1px solid rgba(255,255,255,0.32);
                    font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
                    color: #FFF;">⚡ ×1.0 SURGE</div>
      </div>
      <div style="height: 8px;"></div>
      <div style="font-size: 44px; font-weight: 800; letter-spacing: -0.6px; line-height: 1; position: relative; z-index: 2;">
        7.50 <span style="font-size: 17px; font-weight: 600; color: rgba(255,255,255,0.78);">GEL</span>
      </div>
      <div style="height: 10px;"></div>
      <div style="display: flex; align-items: center; gap: var(--l); position: relative; z-index: 2;">
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600;">
          🕘 7 min
        </span>
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600;">
          📏 2.7 km
        </span>
        <span style="margin-left: auto; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.78);">
          Includes booking fee
        </span>
      </div>
    </div>

    <div class="gap-l"></div>

    <div class="t-label">Payment</div>
    <div class="gap-s"></div>
    <div class="pay-grid">
      <div class="pay-option selected">💵 Cash</div>
      <div class="pay-option">💳 Card</div>
    </div>
  </div>

  <div style="position: absolute; left: var(--xl); right: var(--xl); bottom: 50px;">
    <button class="btn-gradient">Request ride · 7.50 GEL →</button>
    <div style="text-align: center; margin-top: var(--m); font-size: 11px; font-weight: 600;
                color: var(--ink-muted); letter-spacing: 0.5px; text-transform: uppercase;">
      You will be charged after the trip completes
    </div>
  </div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="map" style="filter: brightness(0.7);"><div class="map-road-h" style="top: 18%;"></div><div class="map-road-h" style="top: 72%;"></div><div class="map-road-v" style="left: 28%;"></div><div class="map-road-v" style="left: 70%;"></div><div class="map-river"></div></div>

  <div class="status-bar" style="color: #FFF;">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <div class="modal-scrim">
    <div style="background: var(--surface); border-radius: var(--r-l) var(--r-l) 0 0;
                padding: var(--xl); width: 100%;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div class="h-l">New ride</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 40px; height: 40px; border-radius: 50%;
                      border: 3px solid var(--seed); background: #F1F8F3;
                      display: flex; align-items: center; justify-content: center;
                      font-weight: 600; color: var(--seed); font-size: 16px;">9s</div>
        </div>
      </div>

      <div class="gap-m"></div>

      <div class="list-tile">
        <div class="icon" style="background: #DCEFE3; color: var(--seed);">●</div>
        <div>
          <div class="body-strong">Marjanishvili 4</div>
          <div class="caption">~320 m to pickup · 2 min</div>
        </div>
      </div>
      <div class="list-tile">
        <div class="icon" style="background: #F7D8DD; color: var(--danger);">▲</div>
        <div>
          <div class="body-strong">Vake Park</div>
          <div class="caption">2.7 km trip · ~7 min</div>
        </div>
      </div>

      <div class="gap-m"></div>

      <div style="background: var(--surface-2); border-radius: var(--r-m); padding: var(--m) var(--l);
                  display: flex; align-items: center; justify-content: space-between;">
        <div>
          <div class="caption">Fare</div>
          <div style="font-size: 22px; font-weight: 600;">7.50 GEL</div>
        </div>
        <div style="text-align: right;">
          <div class="caption">Customer rating</div>
          <div class="body-strong">★ 4.92</div>
        </div>
      </div>

      <div class="gap-l"></div>

      <div style="display: flex; gap: var(--m);">
        <button class="btn-outline" style="color: var(--danger); border-color: var(--danger);">Reject</button>
        <button class="btn-primary">Accept</button>
      </div>
    </div>
  </div>
</div>
</body></html>

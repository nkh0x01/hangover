<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <div class="app-bar">
    <span class="back">←</span>
    <span>Confirm ride</span>
  </div>

  <div style="padding: 0 var(--xl);">

    <!-- Route card -->
    <div class="card">
      <div class="route-row">
        <div style="margin-top: 4px;"><div style="width: 12px; height: 12px; border-radius: 50%; background: var(--seed); border: 2.5px solid var(--seed);"></div></div>
        <div>
          <div class="t-label">Pickup</div>
          <div class="t-title-m" style="margin-top: 2px;">Marjanishvili 4</div>
        </div>
      </div>
      <div style="margin-left: 5px;">
        <div class="dotty"></div>
      </div>
      <div class="route-row">
        <div style="margin-top: 4px;">📍</div>
        <div>
          <div class="t-label">Dropoff</div>
          <div class="t-title-m" style="margin-top: 2px;">Vake Park</div>
        </div>
      </div>
    </div>

    <div class="gap-l"></div>

    <!-- Fare hero card -->
    <div class="card">
      <div style="display: flex; align-items: center;">
        <div class="t-label">Estimated fare</div>
        <div style="margin-left: auto;">
          <div class="pill accent"><span class="dot"></span> ×1.0 SURGE</div>
        </div>
      </div>
      <div class="gap-s"></div>
      <div class="t-display">
        7.50 <span style="color: var(--ink-muted); font-size: 18px; font-weight: 600;">GEL</span>
      </div>
      <div class="gap-m"></div>
      <div style="display: flex; align-items: center; gap: var(--l); color: var(--ink-soft);">
        <span class="t-body" style="display: inline-flex; align-items: center; gap: 4px;">
          🕘 7 min
        </span>
        <span class="t-body" style="display: inline-flex; align-items: center; gap: 4px;">
          📏 2.7 km
        </span>
        <span style="margin-left: auto;" class="t-caption">Includes booking fee</span>
      </div>
    </div>

    <div class="gap-l"></div>

    <!-- Payment selector -->
    <div class="t-label">Payment</div>
    <div class="gap-s"></div>
    <div class="pay-grid">
      <div class="pay-option selected">💵 Cash</div>
      <div class="pay-option">💳 Card</div>
    </div>
  </div>

  <div style="position: absolute; left: var(--xl); right: var(--xl); bottom: var(--xl);">
    <button class="btn-primary">Request ride · 7.50 GEL</button>
    <div style="text-align: center; margin-top: var(--m);" class="t-caption">
      You will be charged after the trip completes.
    </div>
  </div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="map">
    <div class="map-road-h" style="top: 18%;"></div>
    <div class="map-road-h" style="top: 72%;"></div>
    <div class="map-road-v" style="left: 28%;"></div>
    <div class="map-road-v" style="left: 70%;"></div>
    <div class="map-river"></div>
  </div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <!-- driver moving toward pickup -->
  <div class="pin pin-driver" style="top: 28%; left: 35%; width: 40px; height: 40px; font-size: 18px;">🛵</div>
  <div class="pin pin-pickup" style="top: 48%; left: 50%;"></div>
  <div class="pin pin-dropoff" style="top: 64%; left: 56%;"></div>

  <!-- route polylines -->
  <svg style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;" viewBox="0 0 393 852" xmlns="http://www.w3.org/2000/svg">
    <path d="M 137 238  C 175 290, 185 360, 196 408" stroke="#1F8F60" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 196 408  L 220 545" stroke="#1F8F60" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.35" stroke-dasharray="2 8" />
  </svg>

  <!-- top notice — eta highlight -->
  <div style="position: absolute; top: 56px; left: var(--l); right: var(--l); z-index: 3;
              background: var(--ink); color: #FFF;
              border-radius: var(--r-pill); padding: 10px var(--l);
              display: flex; align-items: center; gap: 10px;
              box-shadow: 0 6px 16px rgba(0,0,0,0.18);">
    <span style="display: inline-block; width: 10px; height: 10px; background: var(--success); border-radius: 50%; box-shadow: 0 0 0 4px rgba(46,162,101,0.3);"></span>
    <span style="font-weight: 600; font-size: 14px;">Driver arrives in</span>
    <span style="font-weight: 700; font-size: 16px;">2 min</span>
    <span style="margin-left: auto; opacity: 0.7;">→</span>
  </div>

  <!-- driver info bottom sheet -->
  <div class="sheet">
    <div class="handle"></div>

    <div class="phase-progress">
      <div class="seg on"></div>
      <div class="seg on"></div>
      <div class="seg"></div>
      <div class="seg"></div>
    </div>

    <div class="gap-l"></div>

    <div style="display: flex; align-items: center; gap: var(--m);">
      <div class="pill success live"><span class="dot"></span> Driver on the way</div>
      <div style="margin-left: auto;" class="t-title-m">4 min</div>
    </div>

    <div class="gap-m"></div>

    <div style="display: flex; align-items: center; gap: var(--m);">
      <div style="width: 52px; height: 52px; border-radius: 50%; background: var(--surface-2);
                  display: flex; align-items: center; justify-content: center; font-size: 22px;">👤</div>
      <div style="flex: 1;">
        <div class="t-title-l">Giorgi Maisuradze</div>
        <div class="t-body" style="margin-top: 2px;">
          <span style="color: var(--warning);">★</span> 4.92 · 230 trips
        </div>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2);
                  display: flex; align-items: center; justify-content: center;">💬</div>
      <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--seed);
                  display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 18px;">📞</div>
    </div>

    <div class="gap-m"></div>

    <div class="card-soft" style="display: flex; align-items: center; gap: var(--m);">
      <div style="flex: 1;">
        <div class="t-label">Vehicle</div>
        <div class="t-title-m" style="margin-top: 2px;">Xiaomi Mi Pro 2 · Black</div>
      </div>
      <div style="background: #FFF; padding: 6px 10px; border-radius: 6px;
                  font-family: monospace; font-weight: 700; font-size: 14px;
                  border: 1px solid var(--outline-subtle);">
        TB-4291
      </div>
    </div>

    <div class="gap-m"></div>

    <div style="display: flex; align-items: center;">
      <span class="t-body-strong">7.50 GEL · Cash</span>
      <span style="margin-left: auto;" class="btn-text">Cancel ride</span>
    </div>
  </div>
</div>
</body></html>

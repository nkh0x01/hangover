<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="map">
    <div class="map-road-h" style="top: 18%;"></div>
    <div class="map-road-h" style="top: 72%;"></div>
    <div class="map-road-v" style="left: 28%;"></div>
    <div class="map-road-v" style="left: 70%;"></div>
    <div class="map-river"></div>
  </div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <!-- Concentric pulse rings around pickup -->
  <div style="position: absolute; top: 38%; left: 48%; transform: translate(-50%, -50%); z-index: 1;">
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
                width: 220px; height: 220px;
                border: 2px solid rgba(31,143,96,0.18);
                border-radius: 50%;"></div>
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
                width: 120px; height: 120px;
                border: 2px solid rgba(31,143,96,0.28);
                border-radius: 50%;
                background: radial-gradient(rgba(31,143,96,0.10), transparent 70%);"></div>
    <div style="position: relative; width: 22px; height: 22px; border-radius: 50%;
                background: var(--seed); border: 4px solid #FFF;
                box-shadow: 0 4px 12px rgba(31,143,96,0.5);"></div>
  </div>

  <!-- dropoff -->
  <div class="pin pin-dropoff" style="top: 65%; left: 62%;"></div>

  <!-- nearby scooters -->
  <div class="pin pin-driver live" style="top: 25%; left: 30%;">🛵</div>
  <div class="pin pin-driver live" style="top: 52%; left: 25%;">🛵</div>
  <div class="pin pin-driver" style="top: 42%; left: 75%;">🛵</div>

  <!-- searching sheet -->
  <div class="sheet">
    <div class="handle"></div>

    <div class="phase-progress">
      <div class="seg on"></div>
      <div class="seg"></div>
      <div class="seg"></div>
      <div class="seg"></div>
    </div>

    <div class="gap-l"></div>

    <div style="display: flex; align-items: center; gap: var(--m);">
      <div class="pill info live"><span class="dot"></span> Searching</div>
      <div style="margin-left: auto;" class="t-caption">avg 38 s</div>
    </div>

    <div class="gap-m"></div>

    <div class="t-h-m">Looking for a driver nearby</div>
    <div class="gap-xs"></div>
    <div class="t-body">5 scooters are within 1.5 km. Most rides match in under a minute.</div>

    <div class="gap-l"></div>

    <!-- Driver "discovery" tiles -->
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--s);">
      <div class="card-soft" style="text-align: center; padding: var(--m);">
        <div style="font-size: 20px;">🛵</div>
        <div class="t-caption">230 m</div>
      </div>
      <div class="card-soft" style="text-align: center; padding: var(--m);">
        <div style="font-size: 20px;">🛵</div>
        <div class="t-caption">410 m</div>
      </div>
      <div class="card-soft" style="text-align: center; padding: var(--m);">
        <div style="font-size: 20px;">🛵</div>
        <div class="t-caption">1.2 km</div>
      </div>
    </div>

    <div class="gap-l"></div>

    <button class="btn-outline danger">Cancel request</button>
  </div>
</div>
</body></html>

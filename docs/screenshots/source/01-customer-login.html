<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone gradient">
  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <!-- Gradient brand hero -->
  <div style="margin: var(--l) var(--l) var(--xl); position: relative;">
    <div class="hero-band">
      <div class="brand" style="position: relative; z-index: 2;">
        <div class="mark on-color"><div class="h"></div><div class="dot"></div></div>
      </div>
      <div style="height: var(--l); position: relative; z-index: 2;"></div>
      <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.3px; color: #FFF; position: relative; z-index: 2; line-height: 1.15;">
        მოგესალმებით
      </div>
      <div style="height: var(--xs); position: relative; z-index: 2;"></div>
      <div style="font-size: 14px; color: rgba(255,255,255,0.88); position: relative; z-index: 2;">
        Tbilisi-ში სკუტერი ერთი დაკაკუნებით.
      </div>
      <div style="font-size: 14px; color: rgba(255,255,255,0.66); position: relative; z-index: 2;">
        Tbilisi on two wheels.
      </div>
    </div>
  </div>

  <!-- Form -->
  <div style="padding: 0 var(--xl);">
    <div class="field-label">ტელეფონის ნომერი · Phone</div>
    <div class="field focused">
      <span style="color: var(--ink-soft); font-size: 18px;">📞</span>
      <span>+995 555 123 456</span>
    </div>
    <div class="helper">ბმულს გამოგიგზავნით 6-ციფრიან კოდს · We text you a 6-digit code</div>
  </div>

  <!-- Gradient CTA -->
  <div style="position: absolute; left: var(--xl); right: var(--xl); bottom: 60px;">
    <button class="btn-gradient">კოდის გაგზავნა · Send code →</button>
    <div style="text-align: center; margin-top: var(--m); font-size: 11px; font-weight: 600;
                color: var(--ink-muted); letter-spacing: 0.6px; text-transform: uppercase;">
      By continuing you agree to our Terms and Privacy
    </div>
  </div>
</div>
</body></html>

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      ANTHROPIC_API_KEY: test-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, redis, openssl, json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP (php -l) on every file
        run: |
          set -e
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -P4 -n1 php -l > /tmp/lint.out 2>&1 || true
          if grep -v "No syntax errors detected" /tmp/lint.out; then
            echo "PHP syntax errors detected" >&2
            exit 1
          fi

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Generate app key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run migrations (sqlite in-memory)
        run: php artisan migrate --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit --testdox --colors=always

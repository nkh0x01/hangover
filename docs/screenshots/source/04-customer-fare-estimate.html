<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <div class="app-bar">
    <span class="back">←</span>
    <span>Fare estimate</span>
  </div>

  <div style="padding: var(--xl);">

    <!-- Pickup / Dropoff list tiles -->
    <div class="list-tile">
      <div class="icon">●</div>
      <div>
        <div class="body-strong">Marjanishvili 4</div>
        <div class="caption">Pickup</div>
      </div>
    </div>
    <div class="list-tile">
      <div class="icon" style="background: #F7D8DD; color: var(--danger);">▲</div>
      <div>
        <div class="body-strong">Vake Park</div>
        <div class="caption">Dropoff</div>
      </div>
    </div>

    <div class="gap-xl"></div>

    <!-- Fare card -->
    <div class="card" style="display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div class="caption">~2.7 km · 7 min</div>
        <div style="font-size: 32px; font-weight: 600; margin-top: 4px;">7.50 <span style="font-size: 16px; color: var(--on-surface-variant);">GEL</span></div>
        <div class="caption" style="margin-top: 4px;">Includes booking fee</div>
      </div>
      <div style="text-align: right;">
        <div class="badge info">x1.0</div>
        <div class="caption" style="margin-top: 8px;">surge</div>
      </div>
    </div>

    <div class="gap-xl"></div>

    <!-- Payment selector -->
    <div class="body-strong">Payment</div>
    <div class="gap-s"></div>
    <div class="seg">
      <button class="active">💵 Cash</button>
      <button>💳 Card</button>
    </div>
  </div>

  <div style="position: absolute; left: var(--xl); right: var(--xl); bottom: var(--xxl);">
    <button class="btn-primary">Request ride · 7.50 GEL</button>
  </div>
</div>
</body></html>

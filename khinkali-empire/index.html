<!DOCTYPE html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2a0e16" />
    <meta name="description" content="Khinkali Empire — idle assembly-line tycoon" />
    <link rel="icon" href="./public/icons/favicon.svg" type="image/svg+xml" />
    <!-- Georgian-capable font stack covering Latin + Cyrillic + Georgian -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=Noto+Sans:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <title data-i18n="app_title">ხინკლის იმპერია</title>
  </head>
  <body>
    <!-- 3D scene canvas (full-screen; DOM overlay sits above it) -->
    <canvas id="game-canvas"></canvas>

    <!-- Phone-width app shell -->
    <div id="app">
      <!-- ===== HUD (fixed top overlay) ===== -->
      <header id="hud">
        <div class="hud-stats">
          <div class="hud-gold">
            <span class="hud-coin">🪙</span>
            <span id="hud-gold-value">0</span>
          </div>
          <div class="hud-kps">
            <span id="hud-kps-value">0</span>
            <span class="hud-kps-label" data-i18n="kps_label">ხინკალი წამში</span>
          </div>
        </div>
        <button id="settings-btn" class="icon-btn" aria-label="settings">⚙️</button>
      </header>

      <!-- ===== TOP: 3D tower lives in canvas behind; this is just spacing ===== -->
      <section id="tower-zone" aria-hidden="true"></section>

      <!-- ===== MIDDLE: Preparation table ===== -->
      <section id="prep-zone"></section>

      <!-- ===== BOTTOM: Sliding shop sheet ===== -->
      <section id="shop-sheet">
        <div id="shop-handle">
          <div class="handle-grip"></div>
          <div class="handle-gold">
            <span class="hud-coin">🪙</span>
            <span id="handle-gold-value">0</span>
          </div>
          <div class="handle-hint" data-i18n="shop">მაღაზია</div>
        </div>
        <div id="shop-body">
          <div id="shop-tabs">
            <button class="shop-tab active" data-tab="tech" data-i18n="tab_ingredients_tech">
              ინგრედიენტები & ტექნიკა
            </button>
            <button class="shop-tab" data-tab="shares" data-i18n="tab_shares">
              წილები & დაფინანსება
            </button>
          </div>
          <div id="tab-tech" class="shop-tab-panel active"></div>
          <div id="tab-shares" class="shop-tab-panel"></div>
        </div>
      </section>

      <!-- ===== Modals layer ===== -->
      <div id="modal-root"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

name: mobile

on:
  push:
    branches: [master, "claude/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activate Melos
        run: dart pub global activate melos 6.0.0

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Codegen (build_runner)
        run: melos run gen --no-select

      - name: Static analysis
        run: melos run analyze --no-select

      - name: Format check
        run: melos run format-check --no-select

      - name: Tests
        run: melos run test --no-select

  build-android:
    name: build android (customer + driver, dev flavor)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: analyze

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: dart pub global activate melos 6.0.0
      - run: melos bootstrap
      - run: melos run gen --no-select

      - name: Build customer (dev, debug)
        working-directory: mobile/apps/customer_app
        run: flutter build apk --flavor dev --debug --target lib/main_dev.dart

      - name: Build driver (dev, debug)
        working-directory: mobile/apps/driver_app
        run: flutter build apk --flavor dev --debug --target lib/main_dev.dart

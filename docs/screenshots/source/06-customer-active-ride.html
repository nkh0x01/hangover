<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="map"><div class="map-road-h" style="top: 18%;"></div><div class="map-road-h" style="top: 72%;"></div><div class="map-road-v" style="left: 28%;"></div><div class="map-road-v" style="left: 70%;"></div><div class="map-river"></div></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <!-- driver marker moving toward pickup -->
  <div class="pin pin-driver" style="top: 30%; left: 35%;">🛵</div>
  <div class="pin pin-pickup" style="top: 50%; left: 50%;"></div>
  <div class="pin pin-dropoff" style="top: 70%; left: 55%;"></div>

  <svg style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;" viewBox="0 0 393 852" xmlns="http://www.w3.org/2000/svg">
    <path d="M 137 256  C 170 320, 180 380, 196 426" stroke="#1F8F60" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 196 426  L 216 596" stroke="#1F8F60" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.4" stroke-dasharray="2 8" />
  </svg>

  <!-- driver info sheet -->
  <div class="sheet">
    <div class="badge success">DRIVER ON THE WAY</div>
    <div class="gap-m"></div>

    <div style="display: flex; align-items: center; gap: var(--l);">
      <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--surface-2);
                  display: flex; align-items: center; justify-content: center; font-size: 24px;">👤</div>
      <div style="flex: 1;">
        <div class="h-m">Giorgi Maisuradze</div>
        <div class="body" style="margin-top: 2px;">★ 4.92 · 230 trips</div>
      </div>
      <div style="display: flex; gap: var(--s);">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2);
                    display: flex; align-items: center; justify-content: center;">💬</div>
        <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--seed); color: #FFF;
                    display: flex; align-items: center; justify-content: center;">📞</div>
      </div>
    </div>

    <div class="gap-m"></div>

    <div style="background: var(--surface-2); border-radius: var(--r-m); padding: var(--m) var(--l);
                display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div class="caption">Vehicle</div>
        <div class="body-strong">Xiaomi Mi Pro 2 · Black</div>
      </div>
      <div style="background: #FFF; padding: 4px 10px; border-radius: 6px; font-family: monospace; font-weight: 700; font-size: 14px;">
        TB-4291
      </div>
    </div>

    <div class="gap-m"></div>

    <div class="caption" style="display: flex; justify-content: space-between;">
      <span>Arriving in <strong style="color: var(--on-surface);">2 min</strong></span>
      <span>7.50 GEL · Cash</span>
    </div>

    <div class="gap-l"></div>
    <button class="btn-text" style="color: var(--danger);">Cancel ride</button>
  </div>
</div>
</body></html>

  json_annotation: ^4.9.0
  logger: ^2.4.0
  sentry_flutter: ^8.9.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.8.0

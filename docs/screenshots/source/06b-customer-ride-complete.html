<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone gradient">
  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <!-- Celebratory hero -->
  <div style="padding: var(--xxl) var(--xl) var(--l); text-align: center;">

    <div class="success-icon">✓</div>
    <div class="gap-l"></div>
    <div class="t-h-l" style="font-weight: 800;">Trip complete</div>
    <div class="gap-xs"></div>
    <div class="t-body">Thanks for riding with Hangover Mobility.</div>

    <div class="gap-l"></div>

    <!-- Amount card -->
    <div class="card" style="padding: var(--l);">
      <div class="t-label" style="text-align: center;">You paid</div>
      <div class="gap-s"></div>
      <div style="font-size: 44px; font-weight: 800; letter-spacing: -0.6px; line-height: 1; color: var(--ink);">
        7.50 <span style="font-size: 17px; font-weight: 600; color: var(--ink-muted);">GEL</span>
      </div>
      <div class="gap-s"></div>
      <div class="t-caption" style="text-align: center;">Cash · 2.7 km · 7 min</div>
    </div>
  </div>

  <!-- Trip mini-recap card -->
  <div style="padding: 0 var(--xl);">
    <div class="card" style="padding: var(--l);">
      <div class="route-row">
        <div style="margin-top: 2px;"><div style="width: 12px; height: 12px; border-radius: 50%; background: var(--seed); border: 2px solid #FFF; box-shadow: 0 0 0 3px rgba(31,143,96,0.20);"></div></div>
        <div style="flex: 1;">
          <div class="t-label">Pickup</div>
          <div class="t-title-m" style="margin-top: 2px;">Marjanishvili 4</div>
        </div>
        <div class="t-caption">09:32</div>
      </div>
      <div class="dotty"></div>
      <div class="route-row">
        <div style="margin-top: 2px;"><div style="width: 12px; height: 12px; background: var(--danger); border-radius: 2px 12px 12px 12px; transform: rotate(-45deg);"></div></div>
        <div style="flex: 1;">
          <div class="t-label">Dropoff</div>
          <div class="t-title-m" style="margin-top: 2px;">Vake Park</div>
        </div>
        <div class="t-caption">09:39</div>
      </div>
    </div>
  </div>

  <!-- Rate driver row -->
  <div style="padding: var(--l) var(--xl);">
    <div class="card" style="padding: var(--l);">
      <div style="display: flex; align-items: center; gap: var(--m);">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2);
                    display: flex; align-items: center; justify-content: center; font-size: 18px;">👤</div>
        <div style="flex: 1;">
          <div class="t-title-m">Giorgi Maisuradze</div>
          <div class="t-caption">How was your ride?</div>
        </div>
      </div>
      <div class="gap-m"></div>
      <div style="display: flex; gap: var(--s); justify-content: center; font-size: 32px;">
        <span style="color: var(--warning);">★</span>
        <span style="color: var(--warning);">★</span>
        <span style="color: var(--warning);">★</span>
        <span style="color: var(--warning);">★</span>
        <span style="color: var(--warning);">★</span>
      </div>
    </div>
  </div>

  <!-- CTA -->
  <div style="position: absolute; left: var(--xl); right: var(--xl); bottom: 50px;">
    <button class="btn-gradient">Done</button>
    <div class="gap-s"></div>
    <button class="btn-outline">📤 Share trip receipt</button>
  </div>
</div>
</body></html>

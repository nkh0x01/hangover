<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="map">
    <div class="map-road-h" style="top: 18%;"></div>
    <div class="map-road-h" style="top: 72%;"></div>
    <div class="map-road-v" style="left: 28%;"></div>
    <div class="map-road-v" style="left: 70%;"></div>
    <div class="map-river"></div>
  </div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <!-- driver self + route -->
  <div class="pin pin-driver live" style="top: 32%; left: 38%; width: 44px; height: 44px; font-size: 20px;">🛵</div>
  <div class="pin pin-pickup" style="top: 50%; left: 58%;"></div>

  <svg style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;" viewBox="0 0 393 852" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2EC07F"/>
        <stop offset="100%" stop-color="#1F8F60"/>
      </linearGradient>
    </defs>
    <path d="M 149 273  C 200 320, 220 380, 228 425" stroke="url(#rg)" stroke-width="8" stroke-linecap="round" fill="none" />
  </svg>

  <!-- premium nav banner -->
  <div style="position: absolute; top: 56px; left: var(--l); right: var(--l); z-index: 3;
              background: var(--grad-primary); color: #FFF;
              border-radius: var(--r-l);
              padding: var(--m) var(--l);
              display: flex; align-items: center; gap: var(--m);
              box-shadow: var(--sh-hero-green);">
    <div style="width: 44px; height: 44px; border-radius: 50%;
                background: rgba(255,255,255,0.16);
                border: 1px solid rgba(255,255,255,0.30);
                display: flex; align-items: center; justify-content: center;
                font-size: 20px;">🧭</div>
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.7px;
                  text-transform: uppercase; color: rgba(255,255,255,0.78);">Heading to pickup</div>
      <div style="font-size: 17px; font-weight: 800; letter-spacing: -0.2px;">320 m · 2 min</div>
    </div>
    <div style="margin-left: auto; display: flex; gap: var(--s);">
      <div style="width: 40px; height: 40px; border-radius: 50%;
                  background: rgba(255,255,255,0.16);
                  border: 1px solid rgba(255,255,255,0.28);
                  display: flex; align-items: center; justify-content: center;
                  font-size: 16px;">🗺️</div>
    </div>
  </div>

  <!-- Active ride sheet -->
  <div class="sheet">
    <div class="handle"></div>

    <div style="display: flex; align-items: center;">
      <div class="phase-label">Heading to pickup</div>
      <div style="margin-left: auto;" class="t-body-strong">7.50 GEL · cash</div>
    </div>

    <div class="gap-m"></div>

    <div style="display: flex; align-items: flex-start; gap: var(--m);">
      <div style="color: var(--seed); font-size: 18px; margin-top: 4px;">●</div>
      <div style="flex: 1;">
        <div class="t-label">Pickup</div>
        <div class="t-h-m" style="margin-top: 2px;">Marjanishvili 4</div>
        <div class="t-caption" style="margin-top: 2px;">Customer · Nino · ★ 4.92</div>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2);
                  display: flex; align-items: center; justify-content: center;
                  font-size: 16px;
                  box-shadow: var(--sh-card);">💬</div>
      <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--grad-primary);
                  display: flex; align-items: center; justify-content: center;
                  color: #FFF; font-size: 16px;
                  box-shadow: var(--sh-hero-green);">📞</div>
    </div>

    <div class="gap-l"></div>

    <!-- Quick actions row -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--s); margin-bottom: var(--m);">
      <div style="padding: var(--m); background: var(--surface-2); border-radius: var(--r-m);
                  display: flex; align-items: center; gap: var(--s);">
        <span style="font-size: 18px;">🗺️</span>
        <div>
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--ink-muted);">Navigate</div>
          <div style="font-size: 13px; font-weight: 600;">Google Maps</div>
        </div>
      </div>
      <div style="padding: var(--m); background: var(--surface-2); border-radius: var(--r-m);
                  display: flex; align-items: center; gap: var(--s);">
        <span style="font-size: 18px;">⚠️</span>
        <div>
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--ink-muted);">Issue</div>
          <div style="font-size: 13px; font-weight: 600;">Report</div>
        </div>
      </div>
    </div>

    <button class="btn-gradient">I'm on the way →</button>
  </div>
</div>
</body></html>

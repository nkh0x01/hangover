<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <div class="right"><span>5G</span><span>WiFi</span><span>100%</span></div>
  </div>

  <div style="padding: var(--l) var(--xl);">
    <div class="brand">
      <div class="mark"><div class="h"></div><div class="dot"></div></div>
      <div class="wordmark">Hangover Mobility</div>
    </div>
  </div>

  <div style="padding: 0 var(--xl);">
    <div class="gap-xxl"></div>

    <div class="t-h-l">მოგესალმებით</div>
    <div class="gap-xs"></div>
    <div class="t-body" style="line-height: 1.5;">
      Tbilisi-ში სკუტერი ერთი დაკაკუნებით.<br>
      Quick scooter rides across Tbilisi.
    </div>

    <div class="gap-xxl"></div>

    <div class="field-label">ტელეფონის ნომერი · Phone</div>
    <div class="field focused">+995 555 123 456</div>
    <div class="helper">ბმულს გამოგიგზავნით 6-ციფრიან კოდს · We'll text you a 6-digit code</div>
  </div>

  <div style="position: absolute; left: var(--xl); right: var(--xl); bottom: var(--xl);">
    <button class="btn-primary">კოდის გაგზავნა · Send code</button>
    <div style="text-align: center; margin-top: var(--m);" class="t-caption">
      By continuing you agree to our Terms and Privacy Policy
    </div>
  </div>
</div>
</body></html>

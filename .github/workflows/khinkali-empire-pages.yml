name: Deploy Khinkali Empire to GitHub Pages

# Root-level copy of khinkali-empire/.github/workflows/deploy.yml so GitHub
# Actions actually discovers and runs it (workflows must live at the repo root).
# Scoped to the khinkali-empire/ path so it won't run on unrelated monorepo work.

on:
  push:
    branches:
      - main
      - master
      - claude/khinkali-empire-game-89lF4
    paths:
      - 'khinkali-empire/**'
      - '.github/workflows/khinkali-empire-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: khinkali-empire-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: khinkali-empire
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: khinkali-empire/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: khinkali-empire/dist

  deploy:
    needs: build
    # Deploy automatically from the default branches (after merge); skipped on
    # feature branches / PRs so the build check stays green without Pages
    # enabled. A manual "Run workflow" (workflow_dispatch) deploys from any
    # branch, for on-demand verification.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/claude/khinkali-empire-game-89lF4'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
